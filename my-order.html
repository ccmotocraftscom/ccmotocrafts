<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CC Motocrafts · My Order</title><style>body{margin:0;background:#07111a;color:#edf8ff;font:15px system-ui}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#101d29;border:1px solid #294252;border-radius:16px;padding:18px;margin:14px 0}input{width:100%;box-sizing:border-box;padding:13px;background:#07111a;border:1px solid #385367;border-radius:10px;color:white;font:inherit;margin:7px 0 12px}button{padding:12px 16px;border:0;border-radius:10px;background:#20dff2;color:#00131a;font-weight:700}.muted{color:#a9bac8}.record{border-top:1px solid #294252;padding:14px 0}.policy{border:1px solid #426274;border-radius:12px;padding:12px;line-height:1.5;margin-top:12px}</style></head><body><main class="wrap"><small>CC MOTOCRAFTS · AI ENGINE LABS</small><h1>My Order & Service History</h1><section class="card"><p class="muted">Enter the same email used for your booking. Supabase sends a one-time secure sign-in link. Records appear only after email verification.</p><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="Your booking email"><button id="send">Send secure sign-in link</button><p id="msg" class="muted" aria-live="polite"></p><button id="logout" hidden>Sign out</button></section><section id="results" class="card" hidden><h2>Your bookings</h2><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
(()=>{const c=window.CCM_CONFIG||{},$=id=>document.getElementById(id);const WARRANTY='30-Day Service Workmanship Guarantee: CC Motocrafts provides a 30-day workmanship guarantee on eligible services from the service completion date, subject to the job card, approved work scope and stated exclusions. This guarantee covers eligible workmanship-related issues; it does not automatically cover normal wear and tear, accidental damage, misuse, unrelated faults or parts excluded from the job card.';if(!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY){$('msg').textContent='Customer tracking is not configured.';return}const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email){$('msg').textContent='Enter your booking email.';return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/my-order.html'}});$('msg').textContent=error?'Could not send sign-in link: '+error.message:'Secure sign-in link sent. Check your inbox and spam folder.'};async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return;$('logout').hidden=false;const {data,error}=await sb.from('bike_bookings').select('*').eq('email',user.email).order('created_at',{ascending:false}).limit(100);$('results').hidden=false;if(error){$('list').textContent='Unable to load your records. Please contact CC Motocrafts.';return}if(!data?.length){$('list').textContent='No bookings found for this verified email.';return}const codes=data.map(r=>r.booking_id).filter(Boolean);let events=[];if(codes.length){const ev=await sb.from('booking_status_events').select('*').in('booking_code',codes).order('created_at',{ascending:true});if(!ev.error)events=ev.data||[]}$('list').innerHTML=data.map(r=>{const hist=events.filter(e=>e.booking_code===r.booking_id);return `<article class="record"><h3>${esc(r.booking_id||'Booking')}</h3><p><b>Vehicle:</b> ${esc(r.vehicle_brand)} ${esc(r.bike_model)} · ${esc(r.reg_number)}</p><p><b>Service:</b> ${esc(r.service_type)} · ${esc(r.engine_cc)} cc</p><p><b>Status:</b> ${esc(r.status||'Pending')} · <b>Service date:</b> ${esc(r.service_date||'To be confirmed')}</p><p><b>Odometer:</b> ${esc(r.odometer_km||'—')} km · <b>Engine warranty:</b> ${esc(r.engine_warranty_status||'As per job card')}</p><p><b>Covered parts:</b> ${esc(r.warranty_parts_covered||'As stated on job card')}</p>${hist.length?'<p><b>Status history:</b></p><ul>'+hist.map(e=>`<li>${esc(e.created_at)} — ${esc(e.old_status||'Created')} → ${esc(e.new_status)} ${esc(e.change_note||'')}</li>`).join('')+'</ul>':''}<section class="policy"><b>30-Day Service Workmanship Guarantee</b><p>${WARRANTY}</p></section></article>`}).join('')};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange((_e,session)=>{if(session)load()});sb.auth.getSession().then(({data})=>{if(data.session)load()})})();</script></body></html>
